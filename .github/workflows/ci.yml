name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            pacotes: gcc
          # libclang-rt-dev traz o runtime dos sanitizers usados em `make test`
          - cc: clang
            pacotes: clang libclang-rt-dev
    env:
      CC: ${{ matrix.cc }}
      # Versão da libnfe (branch, tag ou commit do tooldoce) usada no CI.
      LIBNFE_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libcurl4-openssl-dev libssl-dev clang-format ${{ matrix.pacotes }}

      # Enquanto a libnfe não for empacotada, ela é compilada a partir do
      # tooldoce; o script grava um libnfe.pc provisório se ela ainda não
      # instalar o seu (icaroraci/tooldoce#266)
      - name: Instalar libnfe
        run: |
          sh .github/scripts/instalar_libnfe.sh "$RUNNER_TEMP/libnfe" "$LIBNFE_REF"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libnfe/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Formatação
        if: matrix.cc == 'gcc'
        run: make verificar-formato

      - name: Compilar
        run: sh .github/scripts/compilar.sh

      - name: Testes
        run: make test

      - name: Exemplos
        run: |
          make exemplos
          ./obj/emitir_nfce tests/certificados/teste.pfx teste 1 CSCTESTE01234567 > /dev/null

      - name: Instalação
        run: |
          destino="$RUNNER_TEMP/destino"
          make install DESTDIR="$destino" PREFIX=/usr
          test -f "$destino/usr/lib/libnfc.so.1.0.0"
          test -L "$destino/usr/lib/libnfc.so.1"
          test -L "$destino/usr/lib/libnfc.so"
          test -f "$destino/usr/include/libnfc/versao.h"
          test -f "$destino/usr/lib/pkgconfig/libnfc.pc"
          readelf -d "$destino/usr/lib/libnfc.so.1.0.0" | grep -q 'SONAME.*libnfc\.so\.1'
          PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$destino/usr/lib/pkgconfig" pkg-config --exists libnfc
          make uninstall DESTDIR="$destino" PREFIX=/usr
          test -z "$(find "$destino" -type f -o -type l)"
